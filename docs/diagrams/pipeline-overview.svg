<?xml version="1.0" encoding="UTF-8"?>
<!-- source-mmd: docs/diagrams/pipeline-overview.mmd sha256:d57b8054bba15a746e133cd74889953a516ce48bab018c01e6f71c4359592497 -->
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="pipeline-overview-title pipeline-overview-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="pipeline-overview-title">Bosun deploy pipeline overview</title>
    <desc id="pipeline-overview-desc">Linear pipeline: a git push is received by Bosun, which clones the repo and decrypts secrets, templates the configs, deploys them to the target, runs docker compose up, and verifies drift.</desc>
    <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');</style>
      <marker id="po-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4a5568"/>
      </marker>
      <marker id="po-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b8860b"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f8f5f0"/>

    <!-- arrows (drawn before boxes) -->
    <!-- row 1: left to right at y=208 -->
    <line x1="304" y1="208" x2="380" y2="208" stroke="#b8860b" stroke-width="1.2" marker-end="url(#po-arrow-accent)"/>
    <line x1="608" y1="208" x2="684" y2="208" stroke="#4a5568" stroke-width="1" marker-end="url(#po-arrow)"/>
    <line x1="912" y1="208" x2="988" y2="208" stroke="#4a5568" stroke-width="1" marker-end="url(#po-arrow)"/>
    <!-- turn: template down to deploy -->
    <line x1="1104" y1="256" x2="1104" y2="396" stroke="#4a5568" stroke-width="1" marker-end="url(#po-arrow)"/>
    <!-- row 2: right to left at y=448 -->
    <line x1="992" y1="448" x2="916" y2="448" stroke="#4a5568" stroke-width="1" marker-end="url(#po-arrow)"/>
    <line x1="688" y1="448" x2="612" y2="448" stroke="#4a5568" stroke-width="1" marker-end="url(#po-arrow)"/>

    <!-- row 1 nodes -->
    <!-- git push : input -->
    <rect x="80" y="160" width="224" height="96" rx="6" fill="#f8f5f0"/>
    <rect x="80" y="160" width="224" height="96" rx="6" fill="rgba(74,85,104,0.10)" stroke="#718096" stroke-width="1"/>
    <text x="192" y="204" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Captain gives orders</text>
    <text x="192" y="222" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">git push</text>

    <!-- bosun receives orders : focal -->
    <rect x="384" y="160" width="224" height="96" rx="6" fill="#f8f5f0"/>
    <rect x="384" y="160" width="224" height="96" rx="6" fill="rgba(184,134,11,0.08)" stroke="#b8860b" stroke-width="1.2"/>
    <text x="496" y="204" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Bosun receives orders</text>
    <text x="496" y="222" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">webhook / poll</text>

    <!-- clone & decrypt : backend -->
    <rect x="688" y="160" width="224" height="96" rx="6" fill="#f8f5f0"/>
    <rect x="688" y="160" width="224" height="96" rx="6" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="800" y="204" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Clone &amp; decrypt</text>
    <text x="800" y="222" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">git + sops/age</text>

    <!-- template configs : backend -->
    <rect x="992" y="160" width="224" height="96" rx="6" fill="#f8f5f0"/>
    <rect x="992" y="160" width="224" height="96" rx="6" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="1104" y="204" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Template configs</text>
    <text x="1104" y="222" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">go templates + sprig</text>

    <!-- row 2 nodes -->
    <!-- deploy to target : backend -->
    <rect x="992" y="400" width="224" height="96" rx="6" fill="#f8f5f0"/>
    <rect x="992" y="400" width="224" height="96" rx="6" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="1104" y="444" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Deploy to target</text>
    <text x="1104" y="462" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">local copy / tar-over-ssh</text>

    <!-- docker compose up : backend -->
    <rect x="688" y="400" width="224" height="96" rx="6" fill="#f8f5f0"/>
    <rect x="688" y="400" width="224" height="96" rx="6" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="800" y="444" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Crew up</text>
    <text x="800" y="462" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">docker compose up</text>

    <!-- drift verification : store -->
    <rect x="384" y="400" width="224" height="96" rx="6" fill="#f8f5f0"/>
    <rect x="384" y="400" width="224" height="96" rx="6" fill="rgba(26,39,68,0.05)" stroke="#4a5568" stroke-width="1"/>
    <text x="496" y="444" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Drift verification</text>
    <text x="496" y="462" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">declared vs actual</text>

    <!-- legend -->
    <line x1="32" y1="632" x2="1248" y2="632" stroke="rgba(26,39,68,0.12)" stroke-width="0.8"/>
    <text x="32" y="656" fill="#4a5568" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="120" y="648" width="12" height="12" rx="2" fill="rgba(184,134,11,0.08)" stroke="#b8860b" stroke-width="1"/>
    <text x="140" y="658" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace">focal step</text>
    <rect x="280" y="648" width="12" height="12" rx="2" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="300" y="658" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace">pipeline step</text>
    <rect x="440" y="648" width="12" height="12" rx="2" fill="rgba(74,85,104,0.10)" stroke="#718096" stroke-width="1"/>
    <text x="460" y="658" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace">operator input</text>
    <rect x="620" y="648" width="12" height="12" rx="2" fill="rgba(26,39,68,0.05)" stroke="#4a5568" stroke-width="1"/>
    <text x="640" y="658" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace">verification</text>
  </svg>
