<div class="page">
  <p class="eyebrow">Bosun · System Architecture</p>
  <h1>Captain, Bosun, Crew</h1>
  <p class="subtitle">The captain (GitHub) gives orders; bosun runs the ship; the crew (containers) does the work.</p>

  <svg viewBox="0 0 1280 720" role="img" aria-labelledby="architecture-title architecture-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="architecture-title">Bosun system architecture</title>
    <desc id="architecture-desc">A git push on GitHub reaches Bosun's radio over webhook or poll; inside the server, Bosun fetches orders, decrypts secrets, preps configs, deploys, and brings the crew of containers up, while drift watch periodically verifies them.</desc>
    <defs>
      <marker id="ar-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4a5568"/>
      </marker>
      <marker id="ar-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1a535c"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f8f5f0"/>

    <!-- zones (painted first) -->
    <!-- Captain (GitHub) -->
    <rect x="48" y="96" width="272" height="176" rx="8" fill="rgba(26,39,68,0.02)" stroke="rgba(26,39,68,0.30)" stroke-width="1" stroke-dasharray="none"/>
    <text x="68" y="124" fill="#718096" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.18em">CAPTAIN · GITHUB</text>
    <!-- Yacht (server) -->
    <rect x="384" y="64" width="848" height="576" rx="8" fill="rgba(26,39,68,0.02)" stroke="#d4c9b8" stroke-width="1"/>
    <text x="404" y="92" fill="#718096" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.18em">YOUR YACHT · SERVER</text>
    <!-- Bosun (inside yacht) -->
    <rect x="416" y="112" width="784" height="320" rx="8" fill="rgba(26,39,68,0.03)" stroke="rgba(26,39,68,0.12)" stroke-width="1"/>
    <text x="436" y="140" fill="#718096" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.18em">BOSUN · SINGLE BINARY</text>

    <!-- arrows (before node boxes) -->
    <!-- push -> radio : external webhook, link blue -->
    <line x1="288" y1="204" x2="444" y2="204" stroke="#1a535c" stroke-width="1.2" marker-end="url(#ar-arrow-link)"/>
    <rect x="330" y="184" width="72" height="12" rx="2" fill="#f8f5f0"/>
    <text x="366" y="193" fill="#1a535c" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEBHOOK</text>
    <!-- radio -> fetch -> decrypt -> template -->
    <line x1="608" y1="204" x2="636" y2="204" stroke="#4a5568" stroke-width="1" marker-end="url(#ar-arrow)"/>
    <line x1="800" y1="204" x2="828" y2="204" stroke="#4a5568" stroke-width="1" marker-end="url(#ar-arrow)"/>
    <line x1="992" y1="204" x2="1020" y2="204" stroke="#4a5568" stroke-width="1" marker-end="url(#ar-arrow)"/>
    <!-- template down to deploy -->
    <line x1="1104" y1="240" x2="1104" y2="308" stroke="#4a5568" stroke-width="1" marker-end="url(#ar-arrow)"/>
    <!-- deploy -> compose (leftward) -->
    <line x1="1024" y1="348" x2="996" y2="348" stroke="#4a5568" stroke-width="1" marker-end="url(#ar-arrow)"/>
    <!-- compose -> crew (down) -->
    <line x1="912" y1="384" x2="912" y2="492" stroke="#4a5568" stroke-width="1" marker-end="url(#ar-arrow)"/>
    <!-- drift -> crew : dashed verify, elbow down then right -->
    <path d="M 528 384 L 528 532 Q 528 540 536 540 L 636 540" fill="none" stroke="#4a5568" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ar-arrow)"/>
    <rect x="544" y="514" width="56" height="12" rx="2" fill="#f8f5f0"/>
    <text x="572" y="523" fill="#718096" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFY</text>

    <!-- Captain: git push (input) -->
    <rect x="80" y="168" width="208" height="72" rx="6" fill="#f8f5f0"/>
    <rect x="80" y="168" width="208" height="72" rx="6" fill="rgba(74,85,104,0.10)" stroke="#718096" stroke-width="1"/>
    <text x="184" y="200" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Orders</text>
    <text x="184" y="218" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">git push</text>

    <!-- Bosun row 1 -->
    <!-- Radio : focal -->
    <rect x="448" y="168" width="160" height="72" rx="6" fill="#f8f5f0"/>
    <rect x="448" y="168" width="160" height="72" rx="6" fill="rgba(184,134,11,0.08)" stroke="#b8860b" stroke-width="1.2"/>
    <text x="528" y="200" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Radio</text>
    <text x="528" y="218" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">webhook / poll</text>

    <!-- Fetch -->
    <rect x="640" y="168" width="160" height="72" rx="6" fill="#f8f5f0"/>
    <rect x="640" y="168" width="160" height="72" rx="6" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="720" y="200" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Fetch orders</text>
    <text x="720" y="218" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">git clone/pull</text>

    <!-- Decrypt -->
    <rect x="832" y="168" width="160" height="72" rx="6" fill="#f8f5f0"/>
    <rect x="832" y="168" width="160" height="72" rx="6" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="912" y="200" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Decrypt secrets</text>
    <text x="912" y="218" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">sops + age</text>

    <!-- Template -->
    <rect x="1024" y="168" width="160" height="72" rx="6" fill="#f8f5f0"/>
    <rect x="1024" y="168" width="160" height="72" rx="6" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="1104" y="200" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Prep configs</text>
    <text x="1104" y="218" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">go templates</text>

    <!-- Bosun row 2 -->
    <!-- Deploy -->
    <rect x="1024" y="312" width="160" height="72" rx="6" fill="#f8f5f0"/>
    <rect x="1024" y="312" width="160" height="72" rx="6" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="1104" y="344" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Deploy</text>
    <text x="1104" y="362" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">tar-over-ssh / local</text>

    <!-- Compose -->
    <rect x="832" y="312" width="160" height="72" rx="6" fill="#f8f5f0"/>
    <rect x="832" y="312" width="160" height="72" rx="6" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="912" y="344" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Crew up</text>
    <text x="912" y="362" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">docker compose</text>

    <!-- Drift : optional/async -->
    <rect x="448" y="312" width="160" height="72" rx="6" fill="#f8f5f0"/>
    <rect x="448" y="312" width="160" height="72" rx="6" fill="rgba(26,39,68,0.02)" stroke="rgba(26,39,68,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="528" y="344" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Drift watch</text>
    <text x="528" y="362" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">periodic check</text>

    <!-- Crew : store -->
    <rect x="640" y="496" width="352" height="88" rx="6" fill="#f8f5f0"/>
    <rect x="640" y="496" width="352" height="88" rx="6" fill="rgba(26,39,68,0.05)" stroke="#4a5568" stroke-width="1"/>
    <text x="816" y="536" fill="#1a2744" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Your crew</text>
    <text x="816" y="554" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">containers</text>

    <!-- legend -->
    <line x1="32" y1="664" x2="1248" y2="664" stroke="rgba(26,39,68,0.12)" stroke-width="0.8"/>
    <text x="32" y="688" fill="#4a5568" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="120" y="680" width="12" height="12" rx="2" fill="rgba(184,134,11,0.08)" stroke="#b8860b" stroke-width="1"/>
    <text x="140" y="690" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace">focal</text>
    <rect x="220" y="680" width="12" height="12" rx="2" fill="#ffffff" stroke="#1a2744" stroke-width="1"/>
    <text x="240" y="690" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace">bosun stage</text>
    <rect x="380" y="680" width="12" height="12" rx="2" fill="rgba(26,39,68,0.05)" stroke="#4a5568" stroke-width="1"/>
    <text x="400" y="690" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace">containers</text>
    <rect x="540" y="680" width="12" height="12" rx="2" fill="rgba(26,39,68,0.02)" stroke="rgba(26,39,68,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="560" y="690" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace">periodic / async</text>
    <line x1="740" y1="686" x2="768" y2="686" stroke="#1a535c" stroke-width="1.2"/>
    <text x="776" y="690" fill="#4a5568" font-size="9" font-family="'IBM Plex Mono', monospace">external call</text>
  </svg>
