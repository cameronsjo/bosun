# Reverse proxy profile - Traefik integration
compose:
  services:
    ${name}:
      networks:
        - proxynet
      labels:
        traefik.enable: "true"
        traefik.http.routers.${name}.rule: Host(`${subdomain}.${domain}`)
        traefik.http.routers.${name}.entrypoints: websecure
        traefik.http.routers.${name}.tls.certresolver: letsencrypt
        traefik.http.routers.${name}.middlewares: secure-defaults@file,default-compress@file
        traefik.http.services.${name}.loadbalancer.server.port: "${port}"

traefik:
  http:
    routers:
      ${name}:
        rule: Host(`${subdomain}.${domain}`)
        service: ${name}
        entrypoints:
          - websecure
        tls:
          certResolver: letsencrypt
        middlewares:
          - secure-defaults@file
          - default-compress@file
    services:
      ${name}:
        loadBalancer:
          servers:
            - url: http://${name}:${port}
