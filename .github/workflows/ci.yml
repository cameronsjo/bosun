name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CI pipeline (Go + WebUI)
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: "latest"
          call: all --source .

      - name: Extract coverage
        uses: dagger/dagger-for-github@v8.2.0
        with:
          version: "latest"
          call: coverage --source . -o coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
