name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Use a GitHub App token for auto-merge so the resulting push event
      # triggers workflows (GITHUB_TOKEN merges are invisible to CI).
      # If the App is not configured, leave the release PR open for manual
      # merge. Invalid configured credentials fail visibly before any merge.
      # See: https://github.com/googleapis/release-please/blob/main/docs/cli.md#github-credentials
      - name: Generate App Token
        if: ${{ steps.release.outputs.pr && vars.RELEASE_APP_ID }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release App not configured
        if: ${{ steps.release.outputs.pr && vars.RELEASE_APP_ID == '' }}
        run: echo "::warning::RELEASE_APP_ID is not configured; leaving the release PR open for manual merge"

      - name: Auto-merge release PR
        if: ${{ steps.release.outputs.pr && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$RELEASE_PR" | jq -r '.number')
          gh pr merge "$PR_NUMBER" --auto --merge

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser via Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "latest"
          call: release --source . --github-token env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Docker image build — goreleaser can't build images inside Dagger (no socket).
      # Quick fix: download the release binary and build+push here.
      # TODO(homelab-1ti): Migrate to Dagger-native container builds.
      - name: Extract version
        id: version
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "v${VERSION}" \
            --pattern "bosun_${VERSION}_linux_amd64.tar.gz" \
            --dir /tmp
          tar -xzf "/tmp/bosun_${VERSION}_linux_amd64.tar.gz" -C bosun/

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        id: docker-push
        with:
          context: bosun
          push: true
          tags: |
            ghcr.io/cameronsjo/bosun:${{ steps.version.outputs.version }}
            ghcr.io/cameronsjo/bosun:latest
          labels: |
            org.opencontainers.image.source=https://github.com/cameronsjo/bosun
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=bosun
            org.opencontainers.image.description=Helm for home - GitOps for Docker Compose
            org.opencontainers.image.licenses=MIT

      - name: Sign container image
        env:
          DIGEST: ${{ steps.docker-push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/cameronsjo/bosun@${DIGEST}"

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/cameronsjo/bosun
          subject-digest: ${{ steps.docker-push.outputs.digest }}
          push-to-registry: true
