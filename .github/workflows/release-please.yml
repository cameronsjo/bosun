name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag to rebuild
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Use a GitHub App token for auto-merge so the resulting push event
      # triggers workflows (GITHUB_TOKEN merges are invisible to CI).
      # If the App is not configured, leave the release PR open for manual
      # merge. Invalid credentials warn and leave that PR open without turning
      # successful release-please generation into a failed workflow.
      # See: https://github.com/googleapis/release-please/blob/main/docs/cli.md#github-credentials
      - name: Generate App Token
        if: ${{ steps.release.outputs.pr && vars.RELEASE_APP_ID }}
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release App not configured
        if: ${{ steps.release.outputs.pr && vars.RELEASE_APP_ID == '' }}
        run: echo "::warning::RELEASE_APP_ID is not configured; leaving the release PR open for manual merge"

      - name: Release App token unavailable
        if: ${{ steps.release.outputs.pr && steps.app-token.outcome == 'failure' }}
        run: echo "::warning::Release App token generation failed; check RELEASE_APP_ID and rotate RELEASE_APP_PRIVATE_KEY, then merge the release PR manually"

      - name: Auto-merge release PR
        if: ${{ steps.release.outputs.pr && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$RELEASE_PR" | jq -r '.number')
          gh pr merge "$PR_NUMBER" --auto --merge

  resolve-release-tag:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release-tag.outputs.tag_name }}
    steps:
      - name: Resolve release tag
        id: release-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_PLEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$RELEASE_PLEASE_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::release tag must be an explicit v-prefixed semantic version"
            exit 64
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gh api --silent "repos/$GH_REPO/git/ref/tags/$tag"
            gh release view "$tag" --repo "$GH_REPO" >/dev/null
          fi

          printf 'tag_name=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs:
      - release-please
      - resolve-release-tag
    if: ${{ always() && needs.resolve-release-tag.result == 'success' && needs.resolve-release-tag.outputs.tag_name != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release-tag.outputs.tag_name }}

      - name: Resolve source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser via Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "latest"
          call: release --source . --github-token env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Docker image build — goreleaser can't build images inside Dagger (no socket).
      # Quick fix: download the release binary and build+push here.
      # TODO(homelab-1ti): Migrate to Dagger-native container builds.
      - name: Extract version
        id: version
        env:
          TAG_NAME: ${{ needs.resolve-release-tag.outputs.tag_name }}
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "v${VERSION}" \
            --pattern "bosun_${VERSION}_linux_amd64.tar.gz" \
            --dir /tmp
          tar -xzf "/tmp/bosun_${VERSION}_linux_amd64.tar.gz" -C bosun/

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        id: docker-push
        with:
          context: bosun
          push: true
          tags: |
            ghcr.io/cameronsjo/bosun:${{ steps.version.outputs.version }}
            ghcr.io/cameronsjo/bosun:latest
          labels: |
            org.opencontainers.image.source=https://github.com/cameronsjo/bosun
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.title=bosun
            org.opencontainers.image.description=Helm for home - GitOps for Docker Compose
            org.opencontainers.image.licenses=MIT

      - name: Sign container image
        env:
          DIGEST: ${{ steps.docker-push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/cameronsjo/bosun@${DIGEST}"

      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/cameronsjo/bosun
          subject-digest: ${{ steps.docker-push.outputs.digest }}
          push-to-registry: true
