name: Spec Review Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  ready-to-build:
    name: Spec PR Review Gate
    if: startsWith(github.head_ref, 'spec/')
    runs-on: ubuntu-latest
    steps:
      - name: Check ready-to-build label
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$PR_LABELS" | grep -q '"ready-to-build"'; then
            echo "Spec PR has ready-to-build label -- review complete"
          else
            echo "::error::Spec PR is missing the ready-to-build label."
            echo ""
            echo "Spec PRs must pass CodeRabbit review before merge."
            echo "Run /spec-review to iterate on findings and apply the label."
            echo ""
            echo "See openspec/AGENTS.md Stage 1.5 for the full workflow."
            exit 1
          fi

  validate-spec:
    name: Validate Spec
    if: startsWith(github.head_ref, 'spec/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec

      - name: Determine changed change IDs
        id: change-id
        env:
          BASE_REF: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # Derive change IDs from the dirs the PR actually touches under
          # openspec/changes/<id>/, not from the branch name. The branch-name
          # convention breaks for fold/refactor PRs whose branch (e.g.
          # spec/fold-cluster-c-multitarget) differs from the change dir they
          # edit (add-multi-target-reconcile). (bosun-6wu)
          git fetch --no-tags origin "$BASE_REF"
          BASE_SHA="$(git rev-parse "origin/$BASE_REF")"
          mapfile -t ids < <(git diff --name-only "$BASE_SHA...HEAD" \
            | sed -nE 's#^openspec/changes/([^/]+)/.*#\1#p' \
            | grep -vx archive \
            | sort -u)
          if [ ${#ids[@]} -eq 0 ]; then
            # Fall back to the branch-name convention for net-new proposals.
            ids=("${BRANCH#spec/}")
            echo "No changed change-dirs in diff; falling back to branch name: ${ids[*]}"
          fi
          echo "Validating change(s): ${ids[*]}"
          echo "ids=${ids[*]}" >> "$GITHUB_OUTPUT"

      - name: Validate spec
        env:
          IDS: ${{ steps.change-id.outputs.ids }}
        run: |
          rc=0
          for id in $IDS; do
            echo "::group::openspec validate $id --strict"
            openspec validate "$id" --strict || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
