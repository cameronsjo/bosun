# Codecov configuration
# Docs: https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down

  status:
    # Project-wide coverage: don't regress from base branch
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error

    # Patch coverage: new/changed lines must be well-covered
    patch:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error

# PR comment configuration
comment:
  layout: "condensed_header, diff, condensed_files, condensed_footer"
  behavior: default
  require_changes: "coverage_drop"
  require_base: false
  require_head: true
  hide_project_coverage: false
