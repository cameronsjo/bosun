server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (also included in every location that sets add_header,
    # because nginx drops inherited server-level add_header directives).
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Health check endpoint for orchestrators
    location /health {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain always;
        return 200 "healthy\n";
    }

    # Proxy API requests to bosun daemon
    location /api/ {
        proxy_pass ${BOSUN_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/auth-header.inc;

        # Timeout settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Static assets with long cache
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
    }

    # Serve runtime config (non-secret runtime settings only)
    location /config.js {
        alias /usr/share/nginx/html/config.js;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;

        # Don't cache index.html
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }
}
