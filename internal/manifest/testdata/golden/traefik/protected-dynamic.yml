http:
    routers:
        secretapp:
            entrypoints:
                - websecure
            middlewares:
                - authelia@file
                - secure-defaults@file
                - default-compress@file
            rule: Host(`secretapp.example.com`)
            service: secretapp
            tls:
                certResolver: letsencrypt
    services:
        secretapp:
            loadBalancer:
                servers:
                    - url: http://secretapp:8080
