apiVersion: bosun.io/v1
kind: Provision
# Headless Chrome sidecar for web scraping/automation
compose:
  services:
    ${name}-chrome:
      image: zenika/alpine-chrome:latest
      container_name: ${name}-chrome
      restart: unless-stopped
      command:
        - "--no-sandbox"
        - "--disable-gpu"
        - "--disable-dev-shm-usage"
        - "--remote-debugging-address=0.0.0.0"
        - "--remote-debugging-port=3000"
        - "--headless"
      networks:
        - internal
    ${name}:
      environment:
        CHROME_WS_ENDPOINT: ws://${name}-chrome:3000
      depends_on:
        - ${name}-chrome
      networks:
        - internal
  networks:
    internal:
